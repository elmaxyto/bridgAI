name: Bug report
description: Report a reproducible problem in BridgAI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove secrets, private source code, personal information, and credentials before submitting. Security vulnerabilities must be reported privately according to SECURITY.md.

  - type: input
    id: version
    attributes:
      label: BridgAI version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Desktop GUI
        - Local web interface
        - Command line
        - Launcher script
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start BridgAI with ...
        2. Select ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      render: text

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I removed secrets, private source code, credentials, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
