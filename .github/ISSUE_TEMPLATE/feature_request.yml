name: Feature request
description: Suggest an improvement for BridgAI
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user need is not adequately supported?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should BridgAI do?
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Explain effects on filesystem access, user approval, rollback, privacy, external services, and backward compatibility.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: This request does not require automatic or hidden filesystem access.
          required: true
        - label: This request preserves explicit approval for destructive or remote operations.
          required: true
