[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "local-ai-bridge"
version = "1.0.0"
description = "Desktop bridge between web AI assistants and local workspaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
"PySide6>=6.7,<7",
"platformdirs>=4.2,<5",
"SpeechRecognition>=3.10,<4",
"sounddevice>=0.5,<0.6",
]
[project.scripts]
local-ai-bridge = "local_ai_bridge.app:main"
local-ai-bridge-web = "local_ai_bridge.web.server:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
local_ai_bridge = ["resources/*.png", "resources/*.ico", "resources/*.svg", "resources/*.json"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "venv", "env", "backups", "build", "dist"]
